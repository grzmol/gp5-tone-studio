# Release: every push to main (a merge from develop) builds macOS, Windows and Linux packages and publishes
# them as GitHub Release v<version>, where <version> comes from app/package.json. Bump it on develop before merging,
# and add its "## [<version>]" section to CHANGELOG.md: that section opens the release notes.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./app/package.json').version")"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump \"version\" in app/package.json on develop, then merge to main again."
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$version]\" section. Add it on develop, then merge to main again."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:toolkit

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
        env:
          # Optional repository secret; without it the TONE3000 sign-in reports a missing app key.
          MAIN_VITE_T3K_CLIENT_ID: ${{ secrets.T3K_CLIENT_ID }}
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Developer ID / Authenticode certificate yet: build unsigned instead of searching the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/release-notes.md
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l packages
          # This version's CHANGELOG section (up to the next "## [" heading or the link list), then the install notes.
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { on = 1; next } on && (/^## \[/ || /^\[[^]]+\]: /) { exit } on' CHANGELOG.md > notes.md
          printf '\n' >> notes.md
          cat .github/release-notes.md >> notes.md
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VLTN Tone Studio $TAG" \
            --notes-file notes.md \
            --generate-notes
