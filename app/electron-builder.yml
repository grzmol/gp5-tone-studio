# Packaging for VLTN Tone Studio (design/electron.md › Packaging and updates).
# Build: `npm run dist` (electron-vite build, then electron-builder for the current OS).
# Releases: .github/workflows/release.yml builds every OS on a push to main and publishes v<version>.
appId: app.vltntonestudio.desktop
productName: VLTN Tone Studio
copyright: Copyright © 2026 VLTN Tone Studio contributors
# No spaces: GitHub turns them into dots in release asset names.
artifactName: vltn-tone-studio-${version}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

# electron-vite emits main, preload and renderer into out/; nothing else ships.
files:
  - out/**/*
  - package.json
  - "!**/*.map"
asarUnpack: []
# Valeton's SnapTone test signal, only when it is in the git-ignored fixtures folder: local `npm run dist`
# builds carry it, CI releases don't (the file isn't ours to publish).
extraResources:
  - from: src/renderer/src/snaptone/fixtures
    to: snaptone
    filter:
      - nam_input_wav.wav

# Double-clicking a preset (or "Open with VLTN Tone Studio") starts the app with the path; the
# single-instance handler forwards it to the running window, which opens it in the Library.
fileAssociations:
  - ext: prst
    name: GP-5 preset
    description: Valeton GP-5 / GP-50 preset
    mimeType: application/x-valeton-prst
    role: Editor
    rank: Owner

linux:
  target:
    - AppImage
    - deb
  category: Audio
  maintainer: grzmol <grzmol@users.noreply.github.com>
  synopsis: Editor and librarian for the Valeton GP-5
  # WebMIDI goes through ALSA sequencer (/dev/snd/seq); users outside the "audio" group are told how to fix
  # it by Device › Diagnostics.
  mimeTypes:
    - application/x-valeton-prst
deb:
  depends:
    - libasound2

win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.music
  hardenedRuntime: true
  # Notarization runs when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set (CI release builds).
  extendInfo:
    # The capture editor auditions NAM captures through the audio interface input (audio only).
    NSMicrophoneUsageDescription: Tone Studio plays your guitar through NAM captures in the capture editor.
dmg:
  title: VLTN Tone Studio
